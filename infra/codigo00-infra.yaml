AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Código 00 — infraestructura en AWS para la API de pagos simulada: red privada, Amazon ECR,
  Amazon ECS Fargate, Application Load Balancer con TLS, AWS WAF, AWS Secrets Manager,
  Amazon CloudWatch Logs y AWS KMS. Diseñada para AWS Academy, donde no se pueden crear
  roles de IAM: la plantilla recibe el ARN del rol LabRole.

Parameters:
  ImageUri:
    Type: String
    Description: URI de la imagen en Amazon ECR (la publica el pipeline con el SHA del commit).
  LabRoleArn:
    Type: String
    Description: ARN del rol LabRole de AWS Academy (ejecución de tareas ECS y registros de flujo de la VPC).
  CertificateArn:
    Type: String
    Description: ARN del certificado de AWS Certificate Manager para el listener HTTPS.
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: >-
      Número de tareas de la API (0 solo en la creación inicial). Se limita a 1 porque la API guarda las
      transacciones en una base SQLite local; escalar requiere una base de datos compartida.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16

Mappings:
  ElbLogAccount:
    us-east-1: { Account: "127311923021" }
    us-west-2: { Account: "797873946194" }

Resources:
  # ------------------------------------------------------------------ Cifrado
  Codigo00Key:
    Type: AWS::KMS::Key
    Properties:
      Description: Llave de Código 00 para registros, imágenes y secretos
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AdministracionDeLaCuenta
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: ["kms:Encrypt*", "kms:Decrypt*", "kms:ReEncrypt*", "kms:GenerateDataKey*", "kms:Describe*"]
            Resource: "*"

  # ------------------------------------------------------------------ Red
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: codigo00 }]

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 365
      KmsKeyId: !GetAtt Codigo00Key.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !Ref LabRoleArn

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  NatEip:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt NatEip.AllocationId, SubnetId: !Ref PublicSubnetA }
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }
  PrivateAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # ------------------------------------------------------------------ Grupos de seguridad
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Balanceador de Codigo 00, solo HTTPS desde internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS de los comercios }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tareas de Codigo 00, solo trafico desde el balanceador
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup,
            Description: Trafico del balanceador a la API }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0,
            Description: HTTPS hacia ECR Secrets Manager y CloudWatch via NAT }

  AlbToTaskEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      DestinationSecurityGroupId: !Ref TaskSecurityGroup
      Description: Del balanceador a las tareas

  # ------------------------------------------------------------------ Registro de imágenes
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: codigo00
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: KMS, KmsKey: !GetAtt Codigo00Key.Arn }
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules":[{"rulePriority":1,"description":"Conservar las ultimas 20 imagenes",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},
          "action":{"type":"expire"}}]}

  # ------------------------------------------------------------------ Secretos y registros
  ApiKeysSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_57
            comment: Las llaves de comercio se rotan en el proceso de alta de comercios; la rotación automática requiere una Lambda que AWS Academy no permite asociar a roles nuevos.
    Properties:
      Description: Llaves de API de los comercios (JSON llave -> comercio)
      KmsKeyId: !Ref Codigo00Key
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: placeholder

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /codigo00/api
      RetentionInDays: 365
      KmsKeyId: !GetAtt Codigo00Key.Arn

  # ------------------------------------------------------------------ Cómputo
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: codigo00-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          User: "10001"
          Privileged: false
          ReadonlyRootFilesystem: true
          PortMappings: [{ ContainerPort: 8000, Protocol: tcp }]
          Secrets:
            - { Name: CODIGO00_API_KEYS, ValueFrom: !Ref ApiKeysSecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup }

  # ------------------------------------------------------------------ Balanceador
  AlbLogBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_145
            comment: Los registros de acceso del ALB solo admiten cifrado SSE-S3; no se puede usar KMS en este bucket.
          - id: CKV_AWS_18
            comment: Es el bucket de destino de registros; registrar el acceso a sí mismo generaría un ciclo.
          - id: CKV2_AWS_62
            comment: El bucket solo recibe registros; no requiere notificaciones de eventos.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules: [{ Id: expirar-registros, Status: Enabled, ExpirationInDays: 365 }]

  AlbLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EntregaDeRegistrosDelAlb
            Effect: Allow
            Principal: { AWS: !Sub ["arn:${AWS::Partition}:iam::${Acct}:root", { Acct: !FindInMap [ElbLogAccount, !Ref "AWS::Region", Account] }] }
            Action: s3:PutObject
            Resource: !Sub "${AlbLogBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*"
          - Sid: SoloTls
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt AlbLogBucket.Arn, !Sub "${AlbLogBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbLogBucketPolicy
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: deletion_protection.enabled, Value: "true" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: access_logs.s3.enabled, Value: "true" }
        - { Key: access_logs.s3.bucket, Value: !Ref AlbLogBucket }
        - { Key: access_logs.s3.prefix, Value: alb }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /health
      Matcher: { HttpCode: "200" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  # ------------------------------------------------------------------ Firewall de aplicaciones
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: codigo00-waf }
      Rules:
        - Name: reglas-comunes
          Priority: 0
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesCommonRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: comunes }
        - Name: entradas-maliciosas-conocidas
          Priority: 1
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: malas-entradas }
        - Name: inyeccion-sql
          Priority: 2
          OverrideAction: { None: {} }
          Statement: { ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: sqli }
        - Name: limite-por-ip
          Priority: 3
          Action: { Block: {} }
          Statement: { RateBasedStatement: { Limit: 2000, AggregateKeyType: IP } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: limite-ip }

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: aws-waf-logs-codigo00
      RetentionInDays: 365
      KmsKeyId: !GetAtt Codigo00Key.Arn

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs: [!GetAtt WafLogGroup.Arn]

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

Outputs:
  ApiUrl:
    Description: URL pública de la API (configurar el DNS del certificado hacia este nombre)
    Value: !Sub "https://${LoadBalancer.DNSName}"
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
